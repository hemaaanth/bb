<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BB inline HTML demo</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
      color: light-dark(#172033, #e8edf7);
      background:
        radial-gradient(circle at 20% 10%, light-dark(#dce9ff, #213253), transparent 42%),
        light-dark(#f7f9fc, #0d111a);
    }
    main {
      width: min(100%, 420px);
      padding: 22px;
      border: 1px solid light-dark(#d8deea, #344058);
      border-radius: 14px;
      background: light-dark(#ffffffd9, #171d29dc);
      box-shadow: 0 18px 45px #0002;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: light-dark(#17663b, #75d69f);
      font-weight: 650;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 15%, transparent);
    }
    h1 { margin: 12px 0 5px; font-size: 22px; letter-spacing: -0.025em; }
    p { margin: 0; color: light-dark(#59657a, #a9b3c6); }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span>Rendered inside BB</div>
    <h1>Inline HTML works.</h1>
    <p>This file is sandboxed, workspace-relative, and generated by the agent.</p>
  </main>
</body>
</html>
